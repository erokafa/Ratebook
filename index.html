<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            blackbg: '#050505',
            carddark: '#121212',
            borderdark: '#262626'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-blackbg text-gray-900 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Supabase Bağlantısı -->
  <script>
    const SUPABASE_URL = "https://ttjnidnzafyhuoxhaojk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GPeu1-_Nj02ab_sGfLdA3w_x23J_bqF";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- Üst Menü / Navbar -->
  <nav class="bg-white dark:bg-carddark border-b border-gray-200 dark:border-borderdark px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div onclick="if(currentUser) showSection('dashboard-section')" class="cursor-pointer flex items-center space-x-2">
      <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-500 via-indigo-500 to-pink-500 tracking-wider hover:opacity-90 transition">
        RateBook
      </span>
    </div>

    <div id="auth-buttons" class="space-x-2">
      <button onclick="showSection('login-section')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium">Giriş Yap</button>
      <button onclick="showSection('register-section')" class="bg-gray-200 dark:bg-borderdark hover:bg-gray-300 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-xl text-sm font-medium">Kayıt Ol</button>
    </div>

    <div id="user-menu" class="hidden flex items-center space-x-3">
      <button onclick="showSection('dashboard-section')" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 text-sm font-medium">Ana Sayfa</button>
      <button onclick="showSection('profile-section')" class="bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 border border-indigo-200 dark:border-indigo-800 px-3 py-1.5 rounded-xl text-xs font-medium text-indigo-600 dark:text-indigo-300">Profilim</button>
      <button onclick="showSection('settings-section')" class="bg-gray-100 dark:bg-borderdark hover:bg-gray-200 dark:hover:bg-gray-800 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-700 dark:text-gray-300">⚙️ Ayarlar</button>
      <span id="user-display-name" class="font-semibold text-sm hidden sm:inline"></span>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium">Çıkış</button>
    </div>
  </nav>

  <!-- Ana İçerik Konteyneri -->
  <main class="max-w-4xl mx-auto p-6">
    
    <!-- KAYIT OL PANELİ (PROFİL FOTOĞRAFI ZORUNLU KILINDI) -->
    <section id="register-section" class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark max-w-md mx-auto my-10 hidden shadow-xl">
      <h2 class="text-2xl font-bold mb-4 text-center">Kayıt Ol</h2>
      <form onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Ad Soyad</label>
          <input type="text" id="reg-fullname" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Kullanıcı Adı</label>
          <input type="text" id="reg-username" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Profil Fotoğrafı URL (Zorunlu)</label>
          <input type="url" id="reg-avatar" required placeholder="https://images.unsplash.com/..." class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">E-posta</label>
          <input type="email" id="reg-email" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Şifre</label>
          <input type="password" id="reg-password" required minlength="6" class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-medium">Hesap Oluştur</button>
      </form>
    </section>

    <!-- GİRİŞ YAP PANELİ -->
    <section id="login-section" class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark max-w-md mx-auto my-10 shadow-xl">
      <h2 class="text-2xl font-bold mb-4 text-center">Giriş Yap</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">E-posta</label>
          <input type="email" id="login-email" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Şifre</label>
          <input type="password" id="login-password" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-medium">Giriş</button>
      </form>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard-section" class="space-y-8 hidden">
      
      <!-- BÜYÜK "BU MU? BU MU?" SIRALAMA BUTONU -->
      <div class="bg-gradient-to-r from-purple-900/40 via-indigo-900/40 to-pink-900/40 p-6 rounded-3xl border border-indigo-500/30 text-center shadow-2xl relative overflow-hidden">
        <h2 class="text-2xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-pink-400 to-indigo-400">⚔️ Hızlı Sıralama: Bu mu? Bu mu?</h2>
        <p class="text-xs text-gray-400 mb-4 max-w-md mx-auto">İki kişi arasında seçim yap, tercihinle sıralamayı anında şekillendir!</p>
        <button onclick="startVersusMode()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg transform hover:scale-105 transition">
          Sıralama Yapmaya Başla 🔥
        </button>
      </div>

      <!-- VERSUS (BU MU BU MU) OYUN ALANI -->
      <div id="versus-container" class="hidden bg-white dark:bg-carddark p-6 rounded-3xl border border-gray-200 dark:border-borderdark shadow-2xl text-center">
        <div class="flex justify-between items-center mb-4">
          <span class="text-xs font-bold text-pink-500 uppercase tracking-widest">Karşılaştırma Modu</span>
          <button onclick="closeVersusMode()" class="text-xs text-gray-500 hover:text-white">Kapat ✖</button>
        </div>
        <div id="versus-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        </div>
      </div>

      <!-- SIRALAMA TABLOSU -->
      <div class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark shadow-lg">
        <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">🏆 Sıralama</h2>
        <div id="leaderboard-list" class="space-y-3">
          <p class="text-gray-500 text-sm">Yükleniyor...</p>
        </div>
      </div>

      <!-- ÜYELERİ DEĞERLENDİR -->
      <div class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark shadow-lg">
        <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">⭐ Üyeleri Değerlendir</h2>
        <div id="users-to-rate" class="grid gap-4 md:grid-cols-2">
        </div>
      </div>
    </section>

    <!-- INSTAGRAM TARZI KAPSAMLI PROFİL -->
    <section id="profile-section" class="bg-white dark:bg-carddark p-8 rounded-3xl border border-gray-200 dark:border-borderdark max-w-2xl mx-auto shadow-2xl hidden">
      <div id="profile-details">
        <p class="text-gray-500 text-sm">Profil yükleniyor...</p>
      </div>
    </section>

    <!-- INSTAGRAM TARZI AYARLAR SEKMESİ -->
    <section id="settings-section" class="bg-white dark:bg-carddark rounded-2xl border border-gray-200 dark:border-borderdark shadow-2xl overflow-hidden hidden">
      <div class="grid grid-cols-1 md:grid-cols-4 min-h-[450px]">
        <div class="border-r border-gray-200 dark:border-borderdark bg-gray-50/50 dark:bg-blackbg/50 p-4 space-y-1">
          <h3 class="text-lg font-bold px-3 py-2 text-indigo-600 dark:text-indigo-400 mb-2">Ayarlar</h3>
          <button onclick="switchSettingsTab('profile')" id="tab-btn-profile" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300">
            👤 Profili Düzenle
          </button>
          <button onclick="switchSettingsTab('theme')" id="tab-btn-theme" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-borderdark transition">
            🎨 Görünüm & Tema
          </button>
        </div>

        <div class="md:col-span-3 p-6">
          <div id="settings-tab-profile" class="space-y-6">
            <h4 class="text-xl font-bold border-b border-gray-200 dark:border-borderdark pb-3">Profili Düzenle</h4>
            <form onsubmit="handleUpdateProfile(event)" class="space-y-4 max-w-md">
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Profil Resmi URL (Zorunlu)</label>
                <input type="url" id="setting-avatar" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Ad Soyad</label>
                <input type="text" id="setting-fullname" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Kullanıcı Adı</label>
                <input type="text" id="setting-username" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Biyografi</label>
                <textarea id="setting-bio" rows="2" placeholder="Kendinden bahset..." class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500"></textarea>
              </div>
              <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium">Değişiklikleri Kaydet</button>
            </form>
          </div>

          <div id="settings-tab-theme" class="space-y-6 hidden">
            <h4 class="text-xl font-bold border-b border-gray-200 dark:border-borderdark pb-3">Görünüm ve Tema</h4>
            <div class="grid grid-cols-2 gap-4 max-w-md pt-2">
              <button onclick="setTheme('dark')" id="theme-card-dark" class="p-4 rounded-2xl border-2 border-indigo-500 bg-blackbg text-white text-center space-y-2 cursor-pointer">
                <div class="text-2xl">🌙</div>
                <div class="font-bold text-sm">Koyu Tema</div>
              </button>
              <button onclick="setTheme('light')" id="theme-card-light" class="p-4 rounded-2xl border border-gray-300 bg-white text-gray-900 text-center space-y-2 cursor-pointer">
                <div class="text-2xl">☀️</div>
                <div class="font-bold text-sm">Açık Tema</div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    let currentUser = null;
    let currentUserProfile = null;
    let allProfiles = [];

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      setTheme(savedTheme);
    }

    function setTheme(mode) {
      if (mode === 'dark') {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    }

    function switchSettingsTab(tabName) {
      ['profile', 'theme'].forEach(t => {
        document.getElementById(`settings-tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-borderdark transition";
      });
      document.getElementById(`settings-tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tabName}`).className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300";
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      } else {
        updateUI(false);
      }
    });

    async function fetchCurrentUserProfile() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        currentUserProfile = data;
        document.getElementById('setting-fullname').value = data.full_name || '';
        document.getElementById('setting-username').value = data.username || '';
        document.getElementById('setting-avatar').value = data.avatar_url || '';
        document.getElementById('setting-bio').value = data.bio || '';
      }
    }

    function showSection(id) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function updateUI(isLoggedIn) {
      if (isLoggedIn) {
        document.getElementById('auth-buttons').classList.add('hidden');
        document.getElementById('user-menu').classList.remove('hidden');
        const nameToShow = currentUserProfile ? currentUserProfile.full_name : currentUser.email;
        document.getElementById('user-display-name').innerText = nameToShow;
        showSection('dashboard-section');
      } else {
        document.getElementById('auth-buttons').classList.remove('hidden');
        document.getElementById('user-menu').classList.add('hidden');
        showSection('login-section');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const full_name = document.getElementById('reg-fullname').value;
      const username = document.getElementById('reg-username').value;
      const avatar_url = document.getElementById('reg-avatar').value;

      if(!avatar_url) {
        alert("Lütfen bir profil fotoğrafı URL'si girin!");
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name, username, avatar_url } }
      });

      if (error) alert("Hata: " + error.message);
      else {
        alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
        showSection('login-section');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) alert("Giriş Başarısız: " + error.message);
      else {
        currentUser = data.user;
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentUserProfile = null;
      updateUI(false);
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const full_name = document.getElementById('setting-fullname').value;
      const username = document.getElementById('setting-username').value;
      const avatar_url = document.getElementById('setting-avatar').value;
      const bio = document.getElementById('setting-bio').value;

      const { error } = await supabaseClient.from('profiles').update({ full_name, username, avatar_url, bio }).eq('id', currentUser.id);

      if (error) alert("Güncelleme başarısız: " + error.message);
      else {
        alert("Profil başarıyla güncellendi!");
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      }
    }

    async function loadDashboardData() {
      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      const { data: evalData } = await supabaseClient.from('evaluations').select('*');

      allProfiles = profiles || [];
      renderLeaderboard(profiles, evalData);
      renderUserRatingCards(profiles, evalData);
      renderProfilePage(evalData);
    }

    /* BU MU BU MU (VERSUS MODU) */
    function startVersusMode() {
      const others = allProfiles.filter(p => p.id !== currentUser.id);
      if (others.length < 2) {
        alert("Karşılaştırma yapmak için en az 2 farklı üye gerekiyor.");
        return;
      }

      // Rastgele 2 kullanıcı seç
      const shuffled = [...others].sort(() => 0.5 - Math.random());
      const userA = shuffled[0];
      const userB = shuffled[1];

      const container = document.getElementById('versus-container');
      const cards = document.getElementById('versus-cards');

      cards.innerHTML = `
        <div onclick="chooseVersusWinner('${userA.id}', '${userB.id}')" class="bg-gray-50 dark:bg-blackbg p-6 rounded-2xl border-2 border-transparent hover:border-pink-500 cursor-pointer transform hover:-translate-y-1 transition text-center group">
          <img src="${userA.avatar_url || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full mx-auto mb-3 object-cover border-2 border-purple-500">
          <h4 class="font-bold text-lg group-hover:text-pink-500">${userA.full_name}</h4>
          <p class="text-xs text-gray-500">@${userA.username}</p>
          <button class="mt-4 bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Bunu Seç ✨</button>
        </div>

        <div class="hidden md:block font-extrabold text-2xl text-pink-500">VS</div>

        <div onclick="chooseVersusWinner('${userB.id}', '${userA.id}')" class="bg-gray-50 dark:bg-blackbg p-6 rounded-2xl border-2 border-transparent hover:border-purple-500 cursor-pointer transform hover:-translate-y-1 transition text-center group">
          <img src="${userB.avatar_url || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full mx-auto mb-3 object-cover border-2 border-indigo-500">
          <h4 class="font-bold text-lg group-hover:text-purple-500">${userB.full_name}</h4>
          <p class="text-xs text-gray-500">@${userB.username}</p>
          <button class="mt-4 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Bunu Seç ✨</button>
        </div>
      `;

      container.classList.remove('hidden');
    }

    async function chooseVersusWinner(winnerId, loserId) {
      await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: winnerId,
        score: 10
      }, { onConflict: 'evaluator_id, target_id' });

      await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: loserId,
        score: 5
      }, { onConflict: 'evaluator_id, target_id' });

      loadDashboardData();
      startVersusMode();
    }

    function closeVersusMode() {
      document.getElementById('versus-container').classList.add('hidden');
    }

    function renderLeaderboard(profiles, evalData) {
      const listEl = document.getElementById('leaderboard-list');
      if (!profiles || profiles.length === 0) {
        listEl.innerHTML = '<p class="text-gray-500 text-sm">Henüz kayıtlı üye yok.</p>';
        return;
      }

      const userScores = profiles.map(profile => {
        const userEvals = (evalData || []).filter(e => e.target_id === profile.id);
        const avgScore = userEvals.length > 0 
          ? (userEvals.reduce((sum, e) => sum + Number(e.score), 0) / userEvals.length).toFixed(1)
          : 'Puan Yok';
        return { ...profile, avgScore, evalCount: userEvals.length };
      });

      userScores.sort((a, b) => (b.avgScore === 'Puan Yok' ? -1 : b.avgScore - a.avgScore));

      listEl.innerHTML = userScores.map((u, index) => `
        <div class="flex items-center justify-between bg-gray-50 dark:bg-blackbg p-3.5 rounded-xl border border-gray-200 dark:border-borderdark">
          <div class="flex items-center space-x-3">
            <span class="font-bold w-6 text-indigo-600 dark:text-indigo-400">#${index + 1}</span>
            <img src="${u.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-borderdark object-cover border border-indigo-500/30">
            <div>
              <p class="font-medium text-sm">${u.full_name}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">@${u.username}</p>
            </div>
          </div>
          <div class="text-right">
            <span class="bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-md border border-indigo-200 dark:border-indigo-800">
              ${u.avgScore} / 10
            </span>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">${u.evalCount} Oy</p>
          </div>
        </div>
      `).join('');
    }

    function renderUserRatingCards(profiles, evalData) {
      const container = document.getElementById('users-to-rate');
      const otherUsers = (profiles || []).filter(p => p.id !== currentUser.id);

      if (otherUsers.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Değerlendirilecek başka üye bulunmuyor.</p>';
        return;
      }

      container.innerHTML = otherUsers.map(u => {
        const myEval = (evalData || []).find(e => e.evaluator_id === currentUser.id && e.target_id === u.id);
        const myScore = myEval ? myEval.score : '';

        return `
          <div class="bg-gray-50 dark:bg-blackbg p-4 rounded-xl border border-gray-200 dark:border-borderdark flex flex-col justify-between">
            <div class="flex items-center space-x-3 mb-3">
              <img src="${u.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-borderdark object-cover">
              <div>
                <p class="font-medium text-sm">${u.full_name}</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">@${u.username}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2 mt-2">
              <input type="number" min="1" max="10" placeholder="1-10" id="score-${u.id}" value="${myScore}"
                class="w-20 bg-white dark:bg-carddark border border-gray-300 dark:border-borderdark rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:border-indigo-500">
              <button onclick="submitRating('${u.id}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-1.5 rounded-lg text-xs font-medium">
                ${myEval ? 'Güncelle' : 'Puan Ver'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* INSTAGRAM TARZI PROFİL DÜZENİ */
    function renderProfilePage(evalData) {
      const profileContainer = document.getElementById('profile-details');
      if (!currentUserProfile) return;

      const myEvals = (evalData || []).filter(e => e.target_id === currentUser.id);
      const avgScore = myEvals.length > 0 
        ? (myEvals.reduce((sum, e) => sum + Number(e.score), 0) / myEvals.length).toFixed(1)
        : '0.0';

      profileContainer.innerHTML = `
        <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-8 pb-6 border-b border-gray-200 dark:border-borderdark">
          <div class="relative">
            <img src="${currentUserProfile.avatar_url || 'https://via.placeholder.com/150'}" class="w-28 h-28 rounded-full object-cover border-4 border-indigo-500 shadow-xl">
          </div>
          <div class="flex-1 text-center sm:text-left space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center space-y-2 sm:space-y-0 sm:space-x-4">
              <h3 class="text-2xl font-bold">@${currentUserProfile.username}</h3>
              <button onclick="showSection('settings-section')" class="bg-gray-100 dark:bg-borderdark hover:bg-gray-200 dark:hover:bg-gray-800 text-xs font-semibold px-4 py-1.5 rounded-xl">
                Profili Düzenle
              </button>
            </div>

            <div class="flex justify-center sm:justify-start space-x-6 text-sm">
              <div><span class="font-bold text-indigo-500">${myEvals.length}</span> <span class="text-gray-500">Oy Alındı</span></div>
              <div><span class="font-bold text-indigo-500">${avgScore}</span> <span class="text-gray-500">Ortalama</span></div>
            </div>

            <div>
              <p class="font-bold text-sm">${currentUserProfile.full_name}</p>
              <p class="text-xs text-gray-400 mt-1">${currentUserProfile.bio || 'Henüz biyografi eklenmedi.'}</p>
            </div>
          </div>
        </div>

        <div class="pt-6">
          <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">İstatistik Özeti</h4>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 dark:bg-blackbg p-4 rounded-2xl border border-gray-200 dark:border-borderdark text-center">
              <p class="text-xs text-gray-400">Genel Skor</p>
              <p class="text-3xl font-black text-indigo-500 mt-1">${avgScore}</p>
            </div>
            <div class="bg-gray-50 dark:bg-blackbg p-4 rounded-2xl border border-gray-200 dark:border-borderdark text-center">
              <p class="text-xs text-gray-400">Değerlendirme Sayısı</p>
              <p class="text-3xl font-black text-pink-500 mt-1">${myEvals.length}</p>
            </div>
          </div>
        </div>
      `;
    }

    async function submitRating(targetId) {
      const score = document.getElementById(`score-${targetId}`).value;
      if (!score || score < 1 || score > 10) {
        alert("Lütfen 1 ile 10 arasında bir puan girin.");
        return;
      }

      const { error } = await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: targetId,
        score: Number(score)
      }, { onConflict: 'evaluator_id, target_id' });

      if (error) alert("Puan kaydedilemedi: " + error.message);
      else {
        alert("Puanınız kaydedildi!");
        loadDashboardData();
      }
    }
  </script>
</body>
</html>
