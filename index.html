<head>

  <script>
    const SUPABASE_URL = "https://ttjnidnzafyhuoxhaojk.supabase.co";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- Üst Menü / Navbar -->
  <nav class="bg-white dark:bg-carddark border-b border-gray-200 dark:border-borderdark px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-50 gap-4">
    
    <!-- Sol Taraf: Logo -->
    <div onclick="if(currentUser) showSection('dashboard-section')" class="cursor-pointer flex items-center shrink-0">
      <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-purple-500 via-indigo-500 to-pink-500 tracking-wider hover:opacity-90 transition">

    <!-- Giriş Yapılmamışsa Butonlar -->

      <button onclick="showSection('login-section')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium">Giriş Yap</button>
      <button onclick="showSection('register-section')" class="bg-gray-200 dark:bg-borderdark hover:bg-gray-300 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-xl text-sm font-medium">Kayıt Ol</button>
    </div>

    <!-- Orta Taraf: Ortalanmış Arama Çubuğu -->
    <div id="nav-search-container" class="hidden flex-1 max-w-xl mx-4">
      <div class="relative w-full">
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="🔍 Kullanıcı ara..." 
          class="w-full bg-gray-100 dark:bg-blackbg border border-gray-200 dark:border-borderdark rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition shadow-inner">
        <div id="search-results" class="hidden absolute top-12 left-0 right-0 bg-white dark:bg-carddark border border-gray-200 dark:border-borderdark rounded-2xl shadow-2xl z-50 max-h-60 overflow-y-auto divide-y divide-gray-100 dark:divide-borderdark">

    <!-- Sağ Taraf: Sekmeler ve Profil / Ayarlar -->
    <div id="user-menu" class="hidden flex items-center space-x-2 sm:space-x-3 shrink-0">
      <button onclick="showSection('dashboard-section')" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 text-xs font-medium px-2 py-1.5">Ana Sayfa</button>
      <button onclick="openMyProfile()" class="bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 border border-indigo-200 dark:border-indigo-800 px-3 py-2 rounded-xl text-xs font-medium text-indigo-600 dark:text-indigo-300">Profilim</button>
      <button onclick="showSection('settings-section')" class="bg-gray-100 dark:bg-borderdark hover:bg-gray-200 dark:hover:bg-gray-800 px-3 py-2 rounded-xl text-xs font-medium text-gray-700 dark:text-gray-300">⚙️ Ayarlar</button>

    </div>

    <!-- Mobil İçin Arama Çubuğu -->
    <div id="mobile-search-container" class="hidden w-full sm:hidden relative mt-1">
      <input type="text" id="mobile-search-input" oninput="handleSearchMobile()" placeholder="🔍 Kullanıcı ara..."

  <!-- Ana İçerik Konteyneri -->

        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Kullanıcı Adı</label>
          <input type="text" id="reg-username" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">

        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">E-posta</label>
          <input type="email" id="reg-email" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Şifre</label>
          <input type="password" id="reg-password" required minlength="6" class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="reg-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-medium">Hesap Oluştur</button>

    </section>

    <!-- GİRİŞ YAP PANELİ -->
    <section id="login-section" class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark max-w-md mx-auto my-10 shadow-xl">
      <h2 class="text-2xl font-bold mb-4 text-center">Giriş Yap</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">E-posta</label>
          <input type="email" id="login-email" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Şifre</label>
          <input type="password" id="login-password" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-medium">Giriş</button>
      </form>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard-section" class="space-y-8 hidden">
      
      <!-- SADELEŞTİRİLMİŞ BU MU? BU MU? KARTI -->
      <div class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark text-center shadow-lg">
        <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-2">Bu mu? Bu mu?</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 max-w-md mx-auto">İki kişi arasında seçim yap, tercihinle sıralamayı anında şekillendir!</p>
        <button onclick="startVersusMode()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition">
          Sıralama Yapmaya Başla
        </button>
      </div>

      <!-- VERSUS (BU MU BU MU) OYUN ALANI -->
      <div id="versus-container" class="hidden bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark shadow-2xl text-center">
        <div class="flex justify-between items-center mb-4">
          <span class="text-xs font-bold text-indigo-500 uppercase tracking-widest">Bu mu? Bu mu?</span>
          <button onclick="closeVersusMode()" class="text-xs text-gray-500 hover:text-white">Kapat ✖</button>
        </div>
        <div id="versus-cards" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        </div>
      </div>

      <!-- SIRALAMA TABLOSU -->
      <div class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark shadow-lg">
        <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">🏆 Sıralama</h2>
        <div id="leaderboard-list" class="space-y-3">
          <p class="text-gray-500 text-sm">Yükleniyor...</p>

      </div>

      <!-- ÜYELERİ DEĞERLENDİR -->
      <div class="bg-white dark:bg-carddark p-6 rounded-2xl border border-gray-200 dark:border-borderdark shadow-lg">
        <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mb-4">⭐ Üyeleri Değerlendir</h2>
        <div id="users-to-rate" class="grid gap-4 md:grid-cols-2">
        </div>
      </div>
    </section>

    <!-- KAPSAMLI PROFİL -->
    <section id="profile-section" class="bg-white dark:bg-carddark p-8 rounded-3xl border border-gray-200 dark:border-borderdark max-w-2xl mx-auto shadow-2xl hidden">
      <div id="profile-details">
        <p class="text-gray-500 text-sm">Profil yükleniyor...</p>
      </div>
    </section>

    <!-- AYARLAR SEKMESİ -->
    <section id="settings-section" class="bg-white dark:bg-carddark rounded-2xl border border-gray-200 dark:border-borderdark shadow-2xl overflow-hidden hidden">
      <div class="grid grid-cols-1 md:grid-cols-4 min-h-[450px]">
        <div class="border-r border-gray-200 dark:border-borderdark bg-gray-50/50 dark:bg-blackbg/50 p-4 space-y-1">
          <h3 class="text-lg font-bold px-3 py-2 text-indigo-600 dark:text-indigo-400 mb-2">Ayarlar</h3>
          <button onclick="switchSettingsTab('profile')" id="tab-btn-profile" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300">
            👤 Profili Düzenle
          </button>
          <button onclick="switchSettingsTab('theme')" id="tab-btn-theme" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-borderdark transition">
            🎨 Görünüm & Tema
          </button>
        </div>

        <div class="md:col-span-3 p-6">
          <div id="settings-tab-profile" class="space-y-6">
            <h4 class="text-xl font-bold border-b border-gray-200 dark:border-borderdark pb-3">Profili Düzenle</h4>
            <form onsubmit="handleUpdateProfile(event)" class="space-y-4 max-w-md">
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Yeni Profil Fotoğrafı Yükle (Galeri/Dosya)</label>
                <input type="file" id="setting-avatar-file" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer border border-gray-300 dark:border-borderdark rounded-xl p-1 bg-gray-50 dark:bg-blackbg">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Ad Soyad</label>
                <input type="text" id="setting-fullname" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Kullanıcı Adı</label>
                <input type="text" id="setting-username" required class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Biyografi</label>
                <textarea id="setting-bio" rows="2" placeholder="Kendinden bahset..." class="w-full bg-gray-50 dark:bg-blackbg border border-gray-300 dark:border-borderdark rounded-xl p-2.5 text-sm focus:outline-none focus:border-indigo-500"></textarea>
              </div>
              <button type="submit" id="setting-submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium">Değişiklikleri Kaydet</button>
            </form>
          </div>

          <div id="settings-tab-theme" class="space-y-6 hidden">
            <h4 class="text-xl font-bold border-b border-gray-200 dark:border-borderdark pb-3">Görünüm ve Tema</h4>
            <div class="grid grid-cols-2 gap-4 max-w-md pt-2">
              <button onclick="setTheme('dark')" id="theme-card-dark" class="p-4 rounded-2xl border-2 border-indigo-500 bg-blackbg text-white text-center space-y-2 cursor-pointer">
                <div class="text-2xl">🌙</div>
                <div class="font-bold text-sm">Koyu Tema</div>
              </button>
              <button onclick="setTheme('light')" id="theme-card-light" class="p-4 rounded-2xl border border-gray-300 bg-white text-gray-900 text-center space-y-2 cursor-pointer">
                <div class="text-2xl">☀️</div>
                <div class="font-bold text-sm">Açık Tema</div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    let currentUser = null;
    let currentUserProfile = null;
    let allProfiles = [];
    let allEvaluations = [];

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      setTheme(savedTheme);
    }

    function setTheme(mode) {
      if (mode === 'dark') {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    }

    function switchSettingsTab(tabName) {
      ['profile', 'theme'].forEach(t => {
        document.getElementById(`settings-tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-borderdark transition";
      });
      document.getElementById(`settings-tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${tabName}`).className = "w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300";
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      } else {
        updateUI(false);
      }
    });

    async function fetchCurrentUserProfile() {
      if (!currentUser) return;
      const { data } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
      if (data) {
        currentUserProfile = data;
        document.getElementById('setting-fullname').value = data.full_name || '';
        document.getElementById('setting-username').value = data.username || '';
        document.getElementById('setting-bio').value = data.bio || '';
      }
    }

    function showSection(id) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function updateUI(isLoggedIn) {
      if (isLoggedIn) {
        document.getElementById('auth-buttons').classList.add('hidden');
        document.getElementById('nav-search-container').classList.remove('hidden');
        document.getElementById('user-menu').classList.remove('hidden');
        document.getElementById('mobile-search-container').classList.remove('hidden');
        const nameToShow = currentUserProfile ? currentUserProfile.full_name : currentUser.email;
        document.getElementById('user-display-name').innerText = nameToShow;
        showSection('dashboard-section');
      } else {
        document.getElementById('auth-buttons').classList.remove('hidden');
        document.getElementById('nav-search-container').classList.add('hidden');
        document.getElementById('user-menu').classList.add('hidden');
        document.getElementById('mobile-search-container').classList.add('hidden');
        showSection('login-section');
      }
    }

    async function uploadAvatarFile(file) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const filePath = `public/${fileName}`;

      const { data, error } = await supabaseClient.storage.from('avatars').upload(filePath, file);

      if (error) {
        throw error;
      }

      const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
      return publicUrlData.publicUrl;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      btn.innerText = "Fotoğraf Yükleniyor...";
      btn.disabled = true;

      try {
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const full_name = document.getElementById('reg-fullname').value;
        const username = document.getElementById('reg-username').value;
        const avatarFile = document.getElementById('reg-avatar-file').files[0];

        let avatar_url = 'https://via.placeholder.com/150';
        if (avatarFile) {
          avatar_url = await uploadAvatarFile(avatarFile);
        }

        btn.innerText = "Hesap Oluşturuluyor...";

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name, username, avatar_url } }
        });

        if (error) throw error;

        alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
        showSection('login-section');
      } catch (err) {
        alert("Hata: " + err.message);
      } finally {
        btn.innerText = "Hesap Oluştur";
        btn.disabled = false;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) alert("Giriş Başarısız: " + error.message);
      else {
        currentUser = data.user;
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentUserProfile = null;
      updateUI(false);
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const btn = document.getElementById('setting-submit-btn');
      btn.innerText = "Kaydediliyor...";
      btn.disabled = true;

      try {
        const full_name = document.getElementById('setting-fullname').value;
        const username = document.getElementById('setting-username').value;
        const bio = document.getElementById('setting-bio').value;
        const avatarFile = document.getElementById('setting-avatar-file').files[0];

        let updateData = { full_name, username, bio };

        if (avatarFile) {
          btn.innerText = "Fotoğraf Yükleniyor...";
          const uploadedUrl = await uploadAvatarFile(avatarFile);
          updateData.avatar_url = uploadedUrl;
        }

        const { error } = await supabaseClient.from('profiles').update(updateData).eq('id', currentUser.id);

        if (error) throw error;

        alert("Profil başarıyla güncellendi!");
        await fetchCurrentUserProfile();
        updateUI(true);
        loadDashboardData();
      } catch (err) {
        alert("Güncelleme başarısız: " + err.message);
      } finally {
        btn.innerText = "Değişiklikleri Kaydet";
        btn.disabled = false;
      }
    }

    async function loadDashboardData() {
      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      const { data: evalData } = await supabaseClient.from('evaluations').select('*');

      allProfiles = profiles || [];
      allEvaluations = evalData || [];

      renderLeaderboard(allProfiles, allEvaluations);
      renderUserRatingCards(allProfiles, allEvaluations);
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      renderSearchResults(query, 'search-results');
    }

    function handleSearchMobile() {
      const query = document.getElementById('mobile-search-input').value.toLowerCase().trim();
      renderSearchResults(query, 'mobile-search-results');
    }

    function renderSearchResults(query, targetContainerId) {
      const resultsEl = document.getElementById(targetContainerId);

      if (!query) {
        resultsEl.classList.add('hidden');
        return;
      }

      const filtered = allProfiles.filter(p => 
        (p.full_name && p.full_name.toLowerCase().includes(query)) || 
        (p.username && p.username.toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        resultsEl.innerHTML = '<div class="p-3 text-xs text-gray-500 text-center">Kullanıcı bulunamadı.</div>';
      } else {
        resultsEl.innerHTML = filtered.map(p => `
          <div onclick="viewUserProfile('${p.id}')" class="flex items-center space-x-3 p-3 hover:bg-gray-50 dark:hover:bg-borderdark/50 cursor-pointer transition">
            <img src="${p.avatar_url || 'https://via.placeholder.com/150'}" class="w-9 h-9 rounded-full object-cover">
            <div>
              <p class="font-semibold text-xs text-gray-900 dark:text-gray-100">${p.full_name}</p>
              <p class="text-[11px] text-gray-400">@${p.username}</p>
            </div>
          </div>
        `).join('');
      }

      resultsEl.classList.remove('hidden');
    }

    function openMyProfile() {
      viewUserProfile(currentUser.id);
    }

    async function viewUserProfile(userId) {
      document.getElementById('search-results').classList.add('hidden');
      document.getElementById('search-input').value = '';
      document.getElementById('mobile-search-results').classList.add('hidden');
      document.getElementById('mobile-search-input').value = '';

      const targetProfile = allProfiles.find(p => p.id === userId);
      if (!targetProfile) return;

      showSection('profile-section');
      const profileContainer = document.getElementById('profile-details');

      const userEvals = allEvaluations.filter(e => e.target_id === userId);
      const avgScore = userEvals.length > 0 
        ? (userEvals.reduce((sum, e) => sum + Number(e.score), 0) / userEvals.length).toFixed(1)
        : '0.0';

      const isMe = userId === currentUser.id;

      const { data: comments } = await supabaseClient
        .from('comments')
        .select('*, author:profiles!author_id(*)')
        .eq('target_id', userId)
        .order('created_at', { ascending: false });

      profileContainer.innerHTML = `
        <div class="flex flex-col sm:flex-row items-center sm:items-start space-y-4 sm:space-y-0 sm:space-x-8 pb-6 border-b border-gray-200 dark:border-borderdark">
          <img src="${targetProfile.avatar_url || 'https://via.placeholder.com/150'}" class="w-28 h-28 rounded-full object-cover border-4 border-indigo-500 shadow-xl">
          <div class="flex-1 text-center sm:text-left space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center space-y-2 sm:space-y-0 sm:space-x-4">
              <h3 class="text-2xl font-bold">@${targetProfile.username}</h3>
              ${isMe ? `
                <button onclick="showSection('settings-section')" class="bg-gray-100 dark:bg-borderdark hover:bg-gray-200 dark:hover:bg-gray-800 text-xs font-semibold px-4 py-1.5 rounded-xl">
                  Profili Düzenle
                </button>
              ` : ''}
            </div>

            <div class="flex justify-center sm:justify-start space-x-6 text-sm">
              <div><span class="font-bold text-indigo-500">${userEvals.length}</span> <span class="text-gray-500">Oy</span></div>
              <div><span class="font-bold text-indigo-500">${avgScore}</span> <span class="text-gray-500">Ortalama</span></div>
            </div>

            <div>
              <p class="font-bold text-sm">${targetProfile.full_name}</p>
              <p class="text-xs text-gray-400 mt-1">${targetProfile.bio || 'Henüz biyografi eklenmedi.'}</p>
            </div>
          </div>
        </div>

        <div class="pt-6 space-y-4">
          <h4 class="text-sm font-bold uppercase tracking-wider text-indigo-500">💬 Yorumlar (${comments ? comments.length : 0})</h4>
          
          <form onsubmit="handleAddComment(event, '${userId}')" class="flex space-x-2">
            <input type="text" id="comment-input" required placeholder="Bu kişi hakkında bir yorum yaz..." 
              class="flex-1 bg-gray-50 dark:bg-blackbg border border-gray-200 dark:border-borderdark rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Gönder</button>
          </form>

          <div class="space-y-3 pt-2">
            ${(!comments || comments.length === 0) ? '<p class="text-xs text-gray-500">Henüz yorum yapılmamış. İlk yorumu sen yap!</p>' : ''}
            ${(comments || []).map(c => `
              <div class="bg-gray-50 dark:bg-blackbg p-3.5 rounded-2xl border border-gray-200 dark:border-borderdark flex items-start space-x-3">
                <img src="${c.author?.avatar_url || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover">
                <div class="flex-1">
                  <div class="flex justify-between items-center">
                    <span class="font-bold text-xs cursor-pointer hover:underline" onclick="viewUserProfile('${c.author?.id}')">${c.author?.full_name || 'Bilinmeyen'}</span>
                    <span class="text-[10px] text-gray-500">${new Date(c.created_at).toLocaleDateString('tr-TR')}</span>
                  </div>
                  <p class="text-xs text-gray-300 mt-1">${c.comment_text}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function handleAddComment(e, targetId) {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const text = input.value.trim();

      if (!text) return;

      const { error } = await supabaseClient.from('comments').insert({
        target_id: targetId,
        author_id: currentUser.id,
        comment_text: text
      });

      if (error) alert("Yorum gönderilemedi: " + error.message);
      else {
        input.value = '';
        viewUserProfile(targetId);
      }
    }

    function startVersusMode() {
      const others = allProfiles.filter(p => p.id !== currentUser.id);
      if (others.length < 2) {
        alert("Karşılaştırma yapmak için en az 2 farklı üye gerekiyor.");
        return;
      }

      const shuffled = [...others].sort(() => 0.5 - Math.random());
      const userA = shuffled[0];
      const userB = shuffled[1];

      const container = document.getElementById('versus-container');
      const cards = document.getElementById('versus-cards');

      cards.innerHTML = `
        <div onclick="chooseVersusWinner('${userA.id}', '${userB.id}')" class="bg-gray-50 dark:bg-blackbg p-6 rounded-2xl border border-gray-200 dark:border-borderdark hover:border-indigo-500 cursor-pointer transform hover:-translate-y-1 transition text-center group">
          <img src="${userA.avatar_url || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full mx-auto mb-3 object-cover border-2 border-indigo-500">
          <h4 class="font-bold text-lg group-hover:text-indigo-500">${userA.full_name}</h4>
          <p class="text-xs text-gray-500">@${userA.username}</p>
          <button class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-xl">Bunu Seç</button>
        </div>

        <div class="hidden md:block font-extrabold text-2xl text-indigo-500">VS</div>

        <div onclick="chooseVersusWinner('${userB.id}', '${userA.id}')" class="bg-gray-50 dark:bg-blackbg p-6 rounded-2xl border border-gray-200 dark:border-borderdark hover:border-indigo-500 cursor-pointer transform hover:-translate-y-1 transition text-center group">
          <img src="${userB.avatar_url || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full mx-auto mb-3 object-cover border-2 border-indigo-500">
          <h4 class="font-bold text-lg group-hover:text-indigo-500">${userB.full_name}</h4>
          <p class="text-xs text-gray-500">@${userB.username}</p>
          <button class="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2 rounded-xl">Bunu Seç</button>
        </div>
      `;

      container.classList.remove('hidden');
    }

    async function chooseVersusWinner(winnerId, loserId) {
      await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: winnerId,
        score: 10
      }, { onConflict: 'evaluator_id, target_id' });

      await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: loserId,
        score: 5
      }, { onConflict: 'evaluator_id, target_id' });

      loadDashboardData();
      startVersusMode();
    }

    function closeVersusMode() {
      document.getElementById('versus-container').classList.add('hidden');
    }

    function renderLeaderboard(profiles, evalData) {
      const listEl = document.getElementById('leaderboard-list');
      if (!profiles || profiles.length === 0) {
        listEl.innerHTML = '<p class="text-gray-500 text-sm">Henüz kayıtlı üye yok.</p>';
        return;
      }

      const userScores = profiles.map(profile => {
        const userEvals = (evalData || []).filter(e => e.target_id === profile.id);
        const avgScore = userEvals.length > 0 
          ? (userEvals.reduce((sum, e) => sum + Number(e.score), 0) / userEvals.length).toFixed(1)
          : 'Puan Yok';
        return { ...profile, avgScore, evalCount: userEvals.length };
      });

      userScores.sort((a, b) => (b.avgScore === 'Puan Yok' ? -1 : b.avgScore - a.avgScore));

      listEl.innerHTML = userScores.map((u, index) => `
        <div onclick="viewUserProfile('${u.id}')" class="flex items-center justify-between bg-gray-50 dark:bg-blackbg p-3.5 rounded-xl border border-gray-200 dark:border-borderdark hover:border-indigo-500 cursor-pointer transition">
          <div class="flex items-center space-x-3">
            <span class="font-bold w-6 text-indigo-600 dark:text-indigo-400">#${index + 1}</span>
            <img src="${u.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-borderdark object-cover border border-indigo-500/30">
            <div>
              <p class="font-medium text-sm hover:underline">${u.full_name}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">@${u.username}</p>
            </div>
          </div>
          <div class="text-right">
            <span class="bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-md border border-indigo-200 dark:border-indigo-800">
              ${u.avgScore} / 10
            </span>
            <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">${u.evalCount} Oy</p>
          </div>
        </div>
      `).join('');
    }

    function renderUserRatingCards(profiles, evalData) {
      const container = document.getElementById('users-to-rate');
      const otherUsers = (profiles || []).filter(p => p.id !== currentUser.id);

      if (otherUsers.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Değerlendirilecek başka üye bulunmuyor.</p>';
        return;
      }

      container.innerHTML = otherUsers.map(u => {
        const myEval = (evalData || []).find(e => e.evaluator_id === currentUser.id && e.target_id === u.id);
        const myScore = myEval ? myEval.score : '';

        return `
          <div class="bg-gray-50 dark:bg-blackbg p-4 rounded-xl border border-gray-200 dark:border-borderdark flex flex-col justify-between">
            <div onclick="viewUserProfile('${u.id}')" class="flex items-center space-x-3 mb-3 cursor-pointer group">
              <img src="${u.avatar_url || 'https://via.placeholder.com/150'}" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-borderdark object-cover">
              <div>
                <p class="font-medium text-sm group-hover:underline">${u.full_name}</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">@${u.username}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2 mt-2">
              <input type="number" min="1" max="10" placeholder="1-10" id="score-${u.id}" value="${myScore}"
                class="w-20 bg-white dark:bg-carddark border border-gray-300 dark:border-borderdark rounded-lg px-2 py-1.5 text-sm text-center focus:outline-none focus:border-indigo-500">
              <button onclick="submitRating('${u.id}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-1.5 rounded-lg text-xs font-medium">
                ${myEval ? 'Güncelle' : 'Puan Ver'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function submitRating(targetId) {
      const score = document.getElementById(`score-${targetId}`).value;
      if (!score || score < 1 || score > 10) {
        alert("Lütfen 1 ile 10 arasında bir puan girin.");
        return;
      }

      const { error } = await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: targetId,
        score: Number(score)
      }, { onConflict: 'evaluator_id, target_id' });

      if (error) alert("Puan kaydedilemedi: " + error.message);
      else {
        alert("Puanınız kaydedildi!");
        loadDashboardData();
      }
    }
  </script>
</body>
</html>
