<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grup Değerlendirme & Sıralama Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Supabase Bağlantı Yapılandırması -->
  <script>
    // BURADAKİ İKİ DEĞERİ KENDİ SUPABASE BİLGİLERİNLE DEĞİŞTİR:
    const SUPABASE_URL = "https://ttjnidnzafyhuoxhaojk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GPeu1-_Nj02ab_sGfLdA3w_x23J_bqF";

    // Değişken adı çakışmasını önlemek için supabaseClient yapıldı
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- Üst Menü / Navbar -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-400">RankMaster</h1>
    <div id="auth-buttons" class="space-x-3">
      <button onclick="showSection('login-section')" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium">Giriş Yap</button>
      <button onclick="showSection('register-section')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium">Kayıt Ol</button>
    </div>
    <div id="user-menu" class="hidden flex items-center space-x-4">
      <span id="user-display-name" class="text-slate-300 font-medium"></span>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-xs font-medium">Çıkış Yap</button>
    </div>
  </nav>

  <!-- Ana İçerik Konteyneri -->
  <main class="max-w-4xl mx-auto p-6">
    
    <!-- KAYIT OL PANELİ -->
    <section id="register-section" class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto my-10 hidden">
      <h2 class="text-2xl font-bold mb-4 text-center">Kayıt Ol</h2>
      <form onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Ad Soyad</label>
          <input type="text" id="reg-fullname" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Kullanıcı Adı</label>
          <input type="text" id="reg-username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label>
          <input type="email" id="reg-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
          <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-medium">Hesap Oluştur</button>
      </form>
    </section>

    <!-- GİRİŞ YAP PANELİ -->
    <section id="login-section" class="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto my-10">
      <h2 class="text-2xl font-bold mb-4 text-center">Giriş Yap</h2>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label>
          <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
          <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-medium">Giriş</button>
      </form>
    </section>

    <!-- DASHBOARD -->
    <section id="dashboard-section" class="space-y-8 hidden">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-xl font-bold text-indigo-400 mb-4">🏆 Genel Liderlik Tablosu</h2>
        <p class="text-xs text-slate-400 mb-4">Tüm üyelerin ortalama puanına göre genel sıralaması.</p>
        <div id="leaderboard-list" class="space-y-3">
          <p class="text-slate-500 text-sm">Yükleniyor...</p>
        </div>
      </div>

      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h2 class="text-xl font-bold text-indigo-400 mb-4">⭐ Üyeleri Değerlendir ve Sırala</h2>
        <div id="users-to-rate" class="grid gap-4 md:grid-cols-2">
        </div>
      </div>
    </section>

  </main>

  <script>
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        updateUI(true);
        loadDashboardData();
      } else {
        updateUI(false);
      }
    });

    function showSection(id) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function updateUI(isLoggedIn) {
      if (isLoggedIn) {
        document.getElementById('auth-buttons').classList.add('hidden');
        document.getElementById('user-menu').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = currentUser.email;
        showSection('dashboard-section');
      } else {
        document.getElementById('auth-buttons').classList.remove('hidden');
        document.getElementById('user-menu').classList.add('hidden');
        showSection('login-section');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const full_name = document.getElementById('reg-fullname').value;
      const username = document.getElementById('reg-username').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name, username } }
      });

      if (error) alert("Hata: " + error.message);
      else {
        alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
        showSection('login-section');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) alert("Giriş Başarısız: " + error.message);
      else {
        currentUser = data.user;
        updateUI(true);
        loadDashboardData();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      updateUI(false);
    }

    async function loadDashboardData() {
      const { data: profiles } = await supabaseClient.from('profiles').select('*');
      const { data: evalData } = await supabaseClient.from('evaluations').select('*');

      renderLeaderboard(profiles, evalData);
      renderUserRatingCards(profiles, evalData);
    }

    function renderLeaderboard(profiles, evalData) {
      const listEl = document.getElementById('leaderboard-list');
      if (!profiles || profiles.length === 0) {
        listEl.innerHTML = '<p class="text-slate-500 text-sm">Henüz kayıtlı üye yok.</p>';
        return;
      }

      const userScores = profiles.map(profile => {
        const userEvals = (evalData || []).filter(e => e.target_id === profile.id);
        const avgScore = userEvals.length > 0 
          ? (userEvals.reduce((sum, e) => sum + Number(e.score), 0) / userEvals.length).toFixed(1)
          : 'Puan Yok';
        return { ...profile, avgScore, evalCount: userEvals.length };
      });

      userScores.sort((a, b) => (b.avgScore === 'Puan Yok' ? -1 : b.avgScore - a.avgScore));

      listEl.innerHTML = userScores.map((u, index) => `
        <div class="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
          <div class="flex items-center space-x-3">
            <span class="font-bold w-6 text-indigo-400">#${index + 1}</span>
            <img src="${u.avatar_url}" class="w-8 h-8 rounded-full bg-slate-700">
            <div>
              <p class="font-medium text-sm">${u.full_name}</p>
              <p class="text-xs text-slate-400">@${u.username}</p>
            </div>
          </div>
          <div class="text-right">
            <span class="bg-indigo-900/50 text-indigo-300 text-xs font-bold px-2.5 py-1 rounded-md border border-indigo-700/30">
              ${u.avgScore} / 10
            </span>
            <p class="text-[10px] text-slate-500 mt-0.5">${u.evalCount} Oy</p>
          </div>
        </div>
      `).join('');
    }

    function renderUserRatingCards(profiles, evalData) {
      const container = document.getElementById('users-to-rate');
      const otherUsers = (profiles || []).filter(p => p.id !== currentUser.id);

      if (otherUsers.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-sm col-span-2">Değerlendirilecek başka üye bulunmuyor.</p>';
        return;
      }

      container.innerHTML = otherUsers.map(u => {
        const myEval = (evalData || []).find(e => e.evaluator_id === currentUser.id && e.target_id === u.id);
        const myScore = myEval ? myEval.score : '';

        return `
          <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex flex-col justify-between">
            <div class="flex items-center space-x-3 mb-3">
              <img src="${u.avatar_url}" class="w-10 h-10 rounded-full bg-slate-700">
              <div>
                <p class="font-medium text-sm">${u.full_name}</p>
                <p class="text-xs text-slate-400">@${u.username}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2 mt-2">
              <input type="number" min="1" max="10" placeholder="1-10" id="score-${u.id}" value="${myScore}"
                class="w-20 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-indigo-500">
              <button onclick="submitRating('${u.id}')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-1 rounded text-xs font-medium">
                ${myEval ? 'Güncelle' : 'Puan Ver'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function submitRating(targetId) {
      const score = document.getElementById(`score-${targetId}`).value;
      if (!score || score < 1 || score > 10) {
        alert("Lütfen 1 ile 10 arasında bir puan girin.");
        return;
      }

      const { error } = await supabaseClient.from('evaluations').upsert({
        evaluator_id: currentUser.id,
        target_id: targetId,
        score: Number(score)
      }, { onConflict: 'evaluator_id, target_id' });

      if (error) alert("Puan kaydedilemedi: " + error.message);
      else {
        alert("Puanınız kaydedildi!");
        loadDashboardData();
      }
    }
  </script>
</body>
</html>
